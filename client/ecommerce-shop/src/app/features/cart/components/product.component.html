<div class="product-container">

  <div class="product-details">

    <div class="image-wrapper">
      <img
        loading="lazy"
        src="{{product.image}}"
        class="product-image"
        alt="{{product.name}}"
      />
    </div>

    <div class="product-info">

      <span class="product-kicker">
        O'BOTTEGA
      </span>

      <div class="product-title">
        {{product.name}}
      </div>

      <div class="product-brand">
        {{product.brand}}
      </div>

      <div class="product-price">
        ${{product.price}}
      </div>

    </div>

  </div>

  <div class="action-buttons">

    <button
      type="button"
      class="details-button"
      routerLink="/products/{{product._id}}"
    >
      View pizza
      <span>→</span>
    </button>

    <button
      type="button"
      class="remove-product-button"
      (click)="removeProduct()"
    >
      <span class="remove-symbol">×</span>
      Remove
    </button>

  </div>

</div>

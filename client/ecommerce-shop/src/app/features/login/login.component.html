<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="brand-mark">O'B</div>

      <span class="auth-kicker">O'BOTTEGA ITALIAN PIZZA</span>

      <h1>Welcome back</h1>

      <p>
        Your next great pizza is only a few clicks away.
      </p>
    </div>

    <div class="form-section">

      <div class="form-intro">
        <span>WELCOME BACK</span>
        <p>Sign in to continue your order.</p>
      </div>

      <form
        class="form"
        [formGroup]="form"
        (ngSubmit)="login()"
      >

        <div class="form-field">
          <label for="email" class="input-label">E-mail</label>

          <input
            type="email"
            id="email"
            class="input-field"
            required
            aria-label="Email address"
            formControlName="email"
            placeholder="you@example.com"
          />

          <ng-container *ngIf="form.get('email')?.touched">
            <p
              class="error"
              *ngIf="form.get('email')?.errors?.['required']"
            >
              Email is required.
            </p>

            <p
              class="error"
              *ngIf="form.get('email')?.errors?.['email']"
            >
              Email is invalid.
            </p>
          </ng-container>
        </div>

        <div class="form-field">
          <label for="password" class="input-label">Password</label>

          <input
            type="password"
            id="password"
            class="input-field"
            required
            aria-label="Password"
            formControlName="password"
            placeholder="Enter your password"
          />

          <ng-container *ngIf="form.get('password')?.touched">
            <p
              class="error"
              *ngIf="form.get('password')?.errors?.['required']"
            >
              Password is required.
            </p>
          </ng-container>
        </div>

        <div class="navigation-controls">
          <button
            type="submit"
            class="next-button"
            aria-label="Log in"
            [disabled]="form.invalid"
          >
            <span>Log In</span>
            <span class="button-arrow">→</span>
          </button>
        </div>

      </form>

      <div class="register-prompt">
        New to O'Bottega?
        <a routerLink="/register">Create an account</a>
      </div>

      <button
        type="button"
        class="back-button"
        aria-label="Go back"
        routerLink="/"
      >
        ← Back to menu
      </button>

    </div>
  </div>
</div>
